name: Production smoke test

# Runs the smoke E2E against production after every successful production
# deploy (Netlify reports GitHub deployment statuses), daily, and on demand.
# Needs repository secrets SMOKE_TEST_EMAIL and SMOKE_TEST_PASSWORD for a
# dedicated test account; the test only touches projects named "Smoke …".

on:
  deployment_status:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: production-smoke
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  E2E_BASE_URL: https://tmcstudio.app

jobs:
  smoke:
    name: Production smoke
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       contains(github.event.deployment.environment, 'Production') &&
       !contains(github.event.deployment.environment, 'Preview'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.15.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke test
        env:
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
        run: |
          if [ -z "$SMOKE_TEST_EMAIL" ] || [ -z "$SMOKE_TEST_PASSWORD" ]; then
            echo "::error::Set SMOKE_TEST_EMAIL and SMOKE_TEST_PASSWORD repository secrets."
            exit 1
          fi
          pnpm exec playwright test --config=e2e/playwright.config.ts production-smoke --retries=1

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-report
          path: e2e/playwright-report/
          retention-days: 14
